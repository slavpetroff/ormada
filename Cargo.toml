[package]
name = "ormada"
version = "0.1.0"
edition = "2021"
authors = ["Stanislav Petroff <slavpetroff@gmail.com>"]
description = "Django-like ergonomic query API for Rust"
license = "MIT OR Apache-2.0"
keywords = ["orm", "database", "ormada", "query"]
categories = ["database"]

[dependencies]
# Core ORM - always required
sea-orm = { version = "~2.0.0-rc.18", features = ["runtime-tokio-native-tls", "sqlx-postgres", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"
rustc-hash = "2.1.1"

# Optional dependencies
ormada-derive = { path = "./derive", optional = true }

[features]
default = ["derive"]
derive = ["ormada-derive"]

[lints.clippy]
# =============================================================================
# PRODUCTION CODE LINTS (applied to lib, NOT tests/benches)
# Tests override these via #![allow(...)] at the top of each test file
# =============================================================================

# Deny panic-inducing methods in production code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Deny risky patterns
indexing_slicing = "warn"
unwrap_in_result = "warn"

# Correctness (errors that are almost certainly bugs)
correctness = { level = "deny", priority = -1 }

# Style lints (warn, not deny)
style = { level = "warn", priority = -1 }

# Complexity lints
complexity = { level = "warn", priority = -1 }

# Performance lints
perf = { level = "warn", priority = -1 }

# Pedantic lints for high quality (warn only)
pedantic = { level = "warn", priority = -1 }

# Nursery lints (experimental, warn only)
nursery = { level = "warn", priority = -1 }

# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
# Forbid unused results at the Rust level
unused_must_use = "deny"
# Forbid unsafe code
unsafe_code = "forbid"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }
serde = { version = "1.0", features = ["derive"] }
criterion = { version = "0.7.0", features = ["async_tokio", "html_reports"] }
rstest = "0.26.1"
trybuild = "1.0"

[[bench]]
name = "query_performance"
harness = false

[[bench]]
name = "cache_performance"
harness = false
