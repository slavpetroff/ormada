[package]
name = "seaorm-django"
version = "0.1.0"
edition = "2021"
authors = ["SeaORM Django Contributors"]
description = "Django-like ergonomic query API for SeaORM with zero duplication"
license = "MIT OR Apache-2.0"
keywords = ["seaorm", "orm", "database", "django", "query"]
categories = ["database"]

[dependencies]
sea-orm = { workspace = true }
chrono = { workspace = true }
once_cell = { workspace = true }
serde_json = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"

# Optional dependencies
seaorm-django-derive = { path = "./derive", optional = true }
rustc-hash = "2.1.1"

[features]
default = ["derive"]
derive = ["seaorm-django-derive"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }
serde = { version = "1.0", features = ["derive"] }
criterion = { version = "0.7.0", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "query_performance"
harness = false

[[bench]]
name = "cache_performance"
harness = false
