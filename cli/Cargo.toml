[package]
name = "ormada-cli"
version = "0.1.0"
edition = "2021"
authors = ["Stanislav Petrov <slavpetroff@gmail.com>"]
description = "CLI tool for Ormada ORM migrations"
license = "MIT"

[[bin]]
name = "ormada"
path = "src/main.rs"

[dependencies]
ormada-schema = { path = "../schema" }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2.0.0-rc.18", features = ["runtime-tokio-native-tls", "sqlx-postgres", "sqlx-sqlite"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
refinery = { version = "0.8", features = ["tokio-postgres", "rusqlite"] }
chrono = "0.4"
colored = "2.1"
dialoguer = "0.11"
indicatif = "0.17"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
