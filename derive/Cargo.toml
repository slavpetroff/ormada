[package]
name = "ormada-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Stanislav Petrov <slavpetroff@gmail.com>"]
description = "Proc macros for Ormada ORM - Django-like ergonomic ORM for Rust"
license = "MIT"
keywords = ["orm", "database", "macro", "derive", "seaorm"]
categories = ["database", "development-tools::procedural-macro-helpers"]
repository = "https://github.com/slavpetroff/ormada"
homepage = "https://github.com/slavpetroff/ormada"
documentation = "https://docs.rs/ormada-derive"
readme = "../README.md"

[lib]
proc-macro = true

# Proc macros are allowed to panic on invalid input - this is standard practice
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
too_many_lines = "allow"
collection_is_never_read = "allow"

[lints.rust]
unused_must_use = "allow"

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"
