name: Publish to crates.io

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'derive/Cargo.toml'
      - 'src/**'
      - 'derive/src/**'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version_check.outputs.should_publish }}
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version_check
        run: |
          # Get current version from Cargo.toml
          CURRENT_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Check if this is the first commit or if Cargo.toml changed
          if git diff HEAD^ HEAD --name-only | grep -q "Cargo.toml"; then
            # Get previous version
            PREV_VERSION=$(git show HEAD^:Cargo.toml | grep -m1 '^version = ' | sed 's/version = "\(.*\)"/\1/' || echo "0.0.0")
            echo "Previous version: $PREV_VERSION"
            
            if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
              echo "Version changed from $PREV_VERSION to $CURRENT_VERSION"
              echo "should_publish=true" >> $GITHUB_OUTPUT
            else
              echo "Version unchanged"
              echo "should_publish=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Cargo.toml not changed"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  publish:
    runs-on: ubuntu-latest
    needs: [check-version, test]
    if: needs.check-version.outputs.should_publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish ormada-derive
        run: |
          cargo publish -p ormada-derive --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Wait for crates.io to process the package
          sleep 30
        continue-on-error: false

      - name: Publish ormada-schema
        run: |
          cargo publish -p ormada-schema --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Wait for crates.io to process the package
          sleep 30
        continue-on-error: false

      - name: Publish ormada
        run: |
          cargo publish -p ormada --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Wait for crates.io to process the package
          sleep 30
        continue-on-error: false

      - name: Publish ormada-cli
        run: |
          cargo publish -p ormada-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: false

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          release_name: Release v${{ needs.check-version.outputs.version }}
          body: |
            Release version ${{ needs.check-version.outputs.version }}
            
            Published to crates.io:
            - ormada-derive v${{ needs.check-version.outputs.version }}
            - ormada-schema v${{ needs.check-version.outputs.version }}
            - ormada v${{ needs.check-version.outputs.version }}
            - ormada-cli v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
